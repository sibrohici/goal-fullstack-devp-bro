<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CSS Flag Project</title>
    <style>
      .flag > p {
        font-size: 5rem;
        margin: 0;
        color: white;
        position: relative;
        left: 300px;
      }
      .flag > div > div > p {
        background-color: white;
        width: 200px;
        height: 200px;
        border-radius: 50%;
        font-size: 80px;
        position: relative;
        left: 350px;
        top: 50px;
        text-align: center;
      }
      .flag {
        background-color: rgb(206, 17, 38);
        width: 900px;
        height: 600px;
      }
      .flag > div {
        background-color: rgb(0, 40, 104);
        width: 900px;
        height: 300px;
        position: relative;
        bottom: 25px;
      }
    </style>
  </head>
  <body>
    <div class="flag">
      <p>The Flag</p>
      <div>
        <div>
          <p>of Laos</p>
        </div>
      </div>
    </div>
  </body>
</html>
