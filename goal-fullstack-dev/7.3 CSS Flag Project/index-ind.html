<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CSS Flag Project</title>
    <style>
      .flag {
        background-color: red;
        width: 900px;
        height: 600px;
        border: 10px solid black;
        position: relative;
      }
      .flag > div {
        background-color: white;
        width: 100%;
        height: 300px;
        position: absolute;
        bottom: 0;
        left: 0;
      }
      .flag > p {
        font-size: 5rem;
        margin: 0;
        color: white;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="flag">
      <p>Indonesia</p>
      <div></div>
    </div>
  </body>
</html>
